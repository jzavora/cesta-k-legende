<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">

<title>Cesta k legendě</title>
<link rel="preload" href="assets/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/bigshoulders-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: 'Archivo'; font-style: normal; font-weight: 400 800; font-display: swap; src: url(assets/archivo-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: 'Archivo'; font-style: normal; font-weight: 400 800; font-display: swap; src: url(assets/archivo-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: 'Big Shoulders Display'; font-style: normal; font-weight: 600 900; font-display: swap; src: url(assets/bigshoulders-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: 'Big Shoulders Display'; font-style: normal; font-weight: 600 900; font-display: swap; src: url(assets/bigshoulders-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  .splash-logo { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 12px 40px -12px #000; animation: splash-bounce 1.2s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .splash-logo { animation: none; } }
  .lock { display: flex; flex-direction: column; gap: 10px; width: min(300px, calc(100vw - 32px)); margin-top: 18px; }
  .lock[hidden] { display: none; }
  .lock input { font: 16px Archivo, system-ui, sans-serif; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(232,238,226,.2); background: #142820; color: #eef1e8; }
  .lock input:focus-visible { outline: 2px solid #ffc94a; outline-offset: 2px; }
  .lock button { font: 800 16px Archivo, system-ui, sans-serif; padding: 12px 14px; border-radius: 10px; border: 0; background: #ffc94a; color: #1b1405; cursor: pointer; }
  .lock button:disabled { opacity: .6; }
  .lock-err { color: #ff8a8a; font-size: 14px; min-height: 20px; text-align: center; }
</style>
<style>
  .splash { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: #0e1d16; color: #eef1e8; font-family: Archivo, system-ui, sans-serif; }
  .splash-ball { font-size: 44px; animation: splash-bounce 1s ease-in-out infinite; }
  .splash-t { font: 900 30px 'Big Shoulders Display', Archivo, sans-serif; letter-spacing: .01em; }
  .splash-s { color: #9db0a3; font-size: 14px; }
  @keyframes splash-bounce { 50% { transform: translateY(-14px); } }
  @media (prefers-reduced-motion: reduce) { .splash-ball { animation: none; } }
</style>
</head>
<body>
<div id="app"><div class="splash"><img class="splash-logo" src="assets/icon-192.png" alt="" width="96" height="96"><div class="splash-t">Cesta k legendě</div><div class="splash-s" id="lock-msg">Načítám…</div>
<form class="lock" id="lock" hidden><input id="lock-pass" type="password" autocomplete="current-password" placeholder="Heslo" aria-label="Heslo" required><button id="lock-go">Hrát</button><div class="lock-err" id="lock-err" role="alert"></div></form></div></div>
<div id="match-root"></div>
<script>
(() => {
  const M = {"salt":"ORwfZ4EuhYv+j2NjihJr5A==","iv":"tS2zi53hlDAEelss","it":250000,"v":"b723265312"}, KEY = 'ckl-lock', $ = id => document.getElementById(id);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const data = fetch('game.bin?v=' + M.v).then(r => { if (!r.ok) throw new Error('net'); return r.arrayBuffer(); });
  // klíč z hesla; po prvním správném zadání si ho zařízení pamatuje (ne heslo samotné)
  const derive = async pass => crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(M.salt), iterations: M.it, hash: 'SHA-256' },
    await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']), { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  async function open(key) {
    const raw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(M.iv) }, key, await data);
    if (!window.DecompressionStream) throw new Error('old');
    const txt = await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    const i = txt.indexOf('\n/*@@CSS@@*/\n'), st = document.createElement('style');
    st.textContent = txt.slice(0, i); document.head.appendChild(st);
    const sc = document.createElement('script'); sc.textContent = txt.slice(i + 13); document.body.appendChild(sc);
  }
  const ask = (msg = '') => { $('lock-msg').textContent = 'Hra je zamčená. Zadej heslo, které ti dal autor.'; $('lock').hidden = false; $('lock-err').textContent = msg; $('lock-pass').focus(); };
  $('lock').addEventListener('submit', async e => {
    e.preventDefault(); $('lock-go').disabled = true; $('lock-err').textContent = '';
    try {
      const key = await derive($('lock-pass').value);
      await open(key);
      try { localStorage.setItem(KEY, JSON.stringify({ salt: M.salt, k: btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw', key)))) })); } catch (x) {}
    } catch (x) { $('lock-go').disabled = false; const m = String(x && x.message); ask(m === 'net' ? 'Hru se nepodařilo stáhnout. Zkontroluj připojení.' : m === 'old' ? 'Prohlížeč je moc starý. Aktualizuj ho a zkus to znovu.' : 'Špatné heslo, zkus to znovu.'); }
  });
  (async () => {
    try {
      const sv = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (sv && sv.salt === M.salt) { await open(await crypto.subtle.importKey('raw', b64(sv.k), 'AES-GCM', false, ['decrypt'])); return; }
      if (sv) localStorage.removeItem(KEY);
    } catch (x) { try { localStorage.removeItem(KEY); } catch (y) {} }
    ask();
  })();
})();
</script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
</html>
